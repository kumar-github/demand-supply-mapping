spring:
  datasource:
    url: "jdbc:postgresql://localhost:5433/benchmatch_test"
    username: postgres
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

vaadin:
  launch-browser: false

logging:
  level:
    com.example.benchmatch: INFO
    org.flywaydb: INFO
